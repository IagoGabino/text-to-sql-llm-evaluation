# ============================================
# PostgreSQL 15 Configuration File
# LLM SQL Evaluation System
# ============================================
# Optimized for bulk data loading and analytical queries
# Assumes 2GB RAM available, adjust based on your system

# ============================================
# CONNECTIONS AND AUTHENTICATION
# ============================================
max_connections = 100
superuser_reserved_connections = 3
# Allow external connections from Docker network and host
listen_addresses = '*'

# ============================================
# MEMORY SETTINGS
# ============================================
# Shared memory buffer pool (25% of RAM minimum)
shared_buffers = 256MB

# Memory for complex sorts and hash tables
work_mem = 16MB

# Memory for maintenance operations (VACUUM, CREATE INDEX)
maintenance_work_mem = 128MB

# Planner's assumption about effective cache (50% of RAM)
effective_cache_size = 512MB

# ============================================
# WRITE AHEAD LOG (WAL) & CHECKPOINTS
# ============================================
# Checkpoint completion target (0.9 = spread checkpoint I/O)
checkpoint_completion_target = 0.9

# WAL buffer size
wal_buffers = 16MB

# Minimum size to keep WAL segments
min_wal_size = 1GB

# Maximum size WAL can grow
max_wal_size = 4GB

# ============================================
# QUERY PLANNER CONFIGURATION
# ============================================
# Random page cost (1.1 for SSDs, 4.0 for HDDs)
random_page_cost = 1.1

# Effective I/O concurrency (200 for SSDs)
effective_io_concurrency = 200

# Statistics target for query planner
default_statistics_target = 100

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Where to log
log_destination = 'stderr'

# Enable logging collector
logging_collector = on

# Log directory (relative to PGDATA or absolute)
log_directory = 'log'

# Log filename pattern
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Log statement types (none, ddl, mod, all)
# 'mod' logs all DDL and DML statements
log_statement = 'mod'

# Don't log query duration by default (enable for debugging)
log_duration = off

# Log line prefix format
log_line_prefix = '%m [%p] %u@%d '

# Minimum duration to log slow queries (in milliseconds)
# Uncomment to enable: log_min_duration_statement = 1000

# ============================================
# AUTOVACUUM CONFIGURATION
# ============================================
# Enable autovacuum daemon
autovacuum = on

# Maximum number of autovacuum workers
autovacuum_max_workers = 3

# Naptime between autovacuum runs
autovacuum_naptime = 1min

# ============================================
# CLIENT CONNECTION DEFAULTS
# ============================================
# Character set encoding
client_encoding = 'UTF8'

# Locale for sorting
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# Default timezone
timezone = 'UTC'

# ============================================
# LOCK MANAGEMENT
# ============================================
# Maximum number of locks per transaction
max_locks_per_transaction = 64

# ============================================
# PERFORMANCE TUNING FOR BULK OPERATIONS
# ============================================
# Temporary note: During bulk data loading, consider:
# - Disabling autovacuum on specific tables
# - Increasing maintenance_work_mem
# - Creating indexes AFTER loading data
# - Running ANALYZE after loading

# ============================================
# MONITORING & STATISTICS
# ============================================
# Enable runtime statistics collection
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none

# ============================================
# ERROR REPORTING AND LOGGING
# ============================================
# Log level: debug5, debug4, debug3, debug2, debug1, info, notice, warning, error, log, fatal, panic
log_min_messages = warning
log_min_error_statement = error

# ============================================
# RESOURCE USAGE (Excluding Memory)
# ============================================
# Maximum number of background worker processes
max_worker_processes = 8

# Maximum parallel workers per gather node
max_parallel_workers_per_gather = 2

# Maximum parallel workers for maintenance operations
max_parallel_maintenance_workers = 2

# Maximum total parallel workers
max_parallel_workers = 8

# ============================================
# NOTES
# ============================================
# This configuration is optimized for:
# - Development environment
# - Bulk data loading (100k+ records)
# - Analytical queries with JOINs and aggregations
# - SSD storage
# - Systems with 2-4GB RAM available for PostgreSQL
#
# For production, adjust based on:
# - Available system memory
# - Storage type (SSD vs HDD)
# - Workload characteristics
# - Concurrent user count
